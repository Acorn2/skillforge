<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f2">
<title>餐食海报 · 真实照片自动排版</title>
<style>
  :root {
    --green: #2f6b3f;
    --green-dark: #1d4a2b;
    --green-soft: #edf3ea;
    --amber: #a9661a;
    --amber-soft: #fbf1e2;
    --ink: #1b201c;
    --muted: #6d766e;
    --line: #e4e7de;
    --bg: #f6f7f2;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 0 16px calc(120px + env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
    font-size: 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .hero { padding: 30px 2px 20px; }
  .hero .mark {
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--green); display: grid; place-items: center; margin-bottom: 14px;
  }
  .hero h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .2px; }
  .hero p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px;
  }
  .step { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  .step b {
    width: 22px; height: 22px; border-radius: 7px; flex: none;
    background: var(--green-soft); color: var(--green-dark);
    font-size: 12px; font-weight: 600; display: grid; place-items: center;
  }
  .step h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .step span { margin-left: auto; font-size: 13px; color: var(--muted); }

  .field { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  input[type=text], input[type=date] {
    width: 100%; padding: 12px 13px; font-size: 16px; font-family: inherit;
    color: var(--ink); background: #fff; border: 1px solid var(--line);
    border-radius: 12px; appearance: none; outline: none;
  }
  input[type=text]:focus, input[type=date]:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,107,63,.10); }
  input::placeholder { color: #a8b0a9; }

  .hint { font-size: 13px; color: var(--muted); margin: 9px 0 0; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row .grow { flex: 1; min-width: 0; }

  .drop {
    display: block; text-align: center; padding: 32px 16px;
    border: 1.5px dashed #c3d1c4; border-radius: 14px;
    background: var(--green-soft); color: var(--green-dark); cursor: pointer;
  }
  .drop strong { display: block; font-size: 16px; font-weight: 600; }
  .drop small { display: block; margin-top: 5px; font-size: 13px; opacity: .72; font-weight: 400; }
  .drop:active { background: #e2eddf; }
  input[type=file] { display: none; }

  .tally { display: flex; gap: 8px; margin: -4px 0 14px; flex-wrap: wrap; }
  .tag {
    font-size: 13px; padding: 5px 11px; border-radius: 999px;
    background: var(--green-soft); color: var(--green-dark);
  }
  .tag.amber { background: var(--amber-soft); color: var(--amber); }
  .tag.gray { background: #f0f1ec; color: var(--muted); }

  .item {
    display: grid; grid-template-columns: 76px 1fr; gap: 12px;
    padding: 14px 0; border-top: 1px solid #eef0ea;
  }
  .item:first-child { border-top: 0; padding-top: 4px; }
  .item img { width: 76px; height: 76px; object-fit: cover; border-radius: 12px; display: block; background: #eef0ea; }
  .item .body { min-width: 0; display: grid; gap: 8px; }

  .seg { display: flex; gap: 4px; background: #f2f4ee; border-radius: 10px; padding: 3px; }
  .seg button {
    flex: 1; padding: 7px 0; font-size: 13px; font-family: inherit; font-weight: 500;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer;
  }
  .seg button.on[data-cat=ingredient] { background: #fff; color: var(--green-dark); box-shadow: 0 1px 2px rgba(0,0,0,.07); }
  .seg button.on[data-cat=finished-dish] { background: #fff; color: var(--amber); box-shadow: 0 1px 2px rgba(0,0,0,.07); }
  .seg button.on[data-cat=dining-scene] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.07); }

  .item .name { padding: 9px 11px; border-radius: 10px; }
  .item .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .item .count { font-variant-numeric: tabular-nums; }
  .item.over .name { border-color: #c25b4e; box-shadow: 0 0 0 3px rgba(194,91,78,.10); }
  .item.over .count { color: #b04a3d; font-weight: 600; }

  .flag { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; font-size: 14px; }
  .flag input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--green); flex: none; }
  .flag + .flag { border-top: 1px solid #f0f2ec; }

  .actionbar {
    position: sticky; bottom: 0; margin: 18px -16px 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, rgba(246,247,242,0), var(--bg) 38%);
  }
  button.primary {
    width: 100%; padding: 15px; font-size: 16px; font-weight: 600; font-family: inherit;
    color: #fff; background: var(--green); border: 0; border-radius: 14px; cursor: pointer;
  }
  button.primary:active { background: var(--green-dark); }
  button.primary:disabled { background: #b7c4b9; }
  button.ghost {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600; font-family: inherit;
    color: var(--green-dark); background: #fff; border: 1px solid var(--green); border-radius: 14px; cursor: pointer;
  }
  button.ghost:active { background: var(--green-soft); }
  .chip {
    padding: 12px 14px; font-size: 14px; font-family: inherit; font-weight: 500;
    color: var(--green-dark); background: #fff; border: 1px solid var(--line);
    border-radius: 12px; cursor: pointer; white-space: nowrap;
  }
  .chip:active { background: var(--green-soft); }
  .quick { display: flex; gap: 8px; margin-top: 10px; }
  .quick .chip { flex: 1; text-align: center; }

  a.ghost-link {
    display: block; text-align: center; text-decoration: none;
    padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 600;
    color: var(--green-dark); background: #fff; border: 1px solid var(--green);
    margin-bottom: 12px;
  }
  a.ghost-link:active { background: var(--green-soft); }

  .poster { width: 100%; border-radius: 14px; display: block; margin-bottom: 12px; border: 1px solid var(--line); }
  pre {
    white-space: pre-wrap; word-break: break-word; font-family: inherit;
    font-size: 14px; line-height: 1.6; background: #f7f8f4; border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; margin: 0 0 12px; max-height: 340px; overflow: auto;
  }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .err { color: #a12b2b; background: #fdeeee; border: 1px solid #f2cfcf; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-top: 12px; }
  .warnbox { font-size: 13px; color: #8a5a12; background: #fdf6e7; border: 1px solid #f0dfba; border-radius: 12px; padding: 11px 13px; margin-top: 12px; }

  .spin {
    display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid #fff; border-top-color: transparent; border-radius: 50%;
    animation: r .7s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M6 19c0-7 4-12 12-13 0 8-4 13-12 13Z" fill="#fff" opacity=".92"/>
        <path d="M6 19c3-4 6-7 11-9" stroke="#2f6b3f" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>餐食海报</h1>
    <p>选好照片，填上菜名，一次生成三张海报和五类文案。</p>
  </header>

  <section class="card">
    <div class="step"><b>1</b><h2>机构名称</h2></div>
    <label class="field" for="brand">印在海报顶部，也会写进文案</label>
    <input type="text" id="brand" maxlength="24" placeholder="例如：三人行托管中心" autocomplete="organization">
  </section>

  <section class="card" id="pickCard">
    <div class="step"><b>2</b><h2>选择照片</h2></div>
    <label class="drop" for="files">
      <strong id="pickText">点这里选照片</strong>
      <small>JPG / PNG，一次最多 30 张</small>
    </label>
    <input type="file" id="files" accept="image/jpeg,image/png" multiple>
    <p class="hint">照片上传到服务器处理，1 小时后自动删除。</p>
  </section>

  <section class="card" id="reviewCard" hidden>
    <div class="step"><b>3</b><h2>逐张确认</h2><span id="tallyText"></span></div>
    <div class="tally" id="tally"></div>
    <div class="quick">
      <button type="button" class="chip" data-bulk="ingredient">全部设为备料</button>
      <button type="button" class="chip" data-bulk="finished-dish">全部设为成品</button>
    </div>
    <div id="list"></div>
  </section>

  <section class="card" id="settingCard" hidden>
    <div class="step"><b>4</b><h2>日期与授权</h2></div>
    <div class="row">
      <div class="grow">
        <label class="field" for="date">拍摄日期</label>
        <input type="date" id="date">
      </div>
      <button type="button" class="chip" id="todayBtn">用今天</button>
    </div>
    <p class="hint">不填就不在海报上显示日期。</p>
    <label class="flag"><input type="checkbox" id="noMinors"> 这批照片里没有孩子或可识别的人</label>
    <label class="flag"><input type="checkbox" id="publishRight"> 机构有这批照片的对外发布权</label>
    <p class="hint">不勾选也能生成，但海报只能内部使用，不能对外发布。</p>
    <div id="genErr"></div>
  </section>

  <div class="actionbar" id="actionbar" hidden>
    <p class="hint" id="blockHint" style="margin:0 0 10px" hidden></p>
    <button class="primary" id="go">生成海报</button>
  </div>

  <section id="resultCard" hidden>
    <div class="card">
      <div class="step"><b>✓</b><h2>海报</h2></div>
      <div id="posters"></div>
      <a id="zipBtn" class="ghost-link" hidden>打包下载</a>
      <p class="note">手机上也可以长按单张图片保存到相册。</p>
    </div>
    <div class="card">
      <div class="step"><b>文</b><h2>发布文案</h2></div>
      <pre id="copy"></pre>
      <button class="ghost" id="copyBtn">复制文案</button>
    </div>
    <div class="card">
      <button class="ghost" id="again">再做一批</button>
    </div>
  </section>
</div>

<script type="module">
import { limitsFor, unitsOf } from './label-fit.mjs';

const state = { batchId: null, assets: [], picks: new Map() };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const remember = {
  get: key => { try { return localStorage.getItem(key); } catch { return null; } },
  set: (key, value) => { try { localStorage.setItem(key, value); } catch {} }
};

const savedBrand = remember.get('meal-brand');
if (savedBrand) $('brand').value = savedBrand;
$('brand').addEventListener('input', event => remember.set('meal-brand', event.target.value.trim()));

function showError(host, message) {
  host.innerHTML = message ? `<div class="err">${esc(message)}</div>` : '';
}

$('files').addEventListener('change', async event => {
  const files = [...event.target.files];
  if (!files.length) return;
  $('pickText').textContent = '正在读取照片…';
  const payload = await Promise.all(files.map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, dataUrl: reader.result });
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  })));
  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: payload.filter(Boolean) })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '读取失败');
    state.batchId = data.batchId;
    state.assets = data.assets;
    renderList(data);
  } catch (error) {
    $('pickText').textContent = '点这里选照片';
    showError($('genErr'), error.message);
    $('settingCard').hidden = false;
  }
});

function counts() {
  const result = { ingredient: 0, 'finished-dish': 0, 'dining-scene': 0 };
  for (const pick of state.picks.values()) result[pick.category] = (result[pick.category] ?? 0) + 1;
  return result;
}

function renderList(data) {
  state.picks = new Map(data.assets.map(asset => [asset.id, { category: 'finished-dish', label: '' }]));
  $('list').innerHTML = data.assets.map(asset => `
    <div class="item" data-id="${asset.id}">
      <img src="${asset.thumb}" alt="">
      <div class="body">
        <div class="seg">
          <button type="button" data-cat="ingredient">备料</button>
          <button type="button" data-cat="finished-dish" class="on">成品</button>
          <button type="button" data-cat="dining-scene">环境</button>
        </div>
        <input class="name" type="text" maxlength="30" placeholder="菜名，可不填">
        <div class="foot"><span class="tip">留空显示「餐食实拍」</span><span class="count"></span></div>
      </div>
    </div>`).join('');

  $('reviewCard').hidden = false;
  $('settingCard').hidden = false;
  $('actionbar').hidden = false;
  $('resultCard').hidden = true;
  $('pickText').textContent = `已选择 ${data.count} 张，换一批？`;
  if (data.warnings?.length) {
    const box = document.createElement('div');
    box.className = 'warnbox';
    box.textContent = `有 ${data.warnings.length} 条提示：${data.warnings.map(w => w.code).join('、')}`;
    $('reviewCard').appendChild(box);
  }
  updateLimits();
  $('reviewCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function updateLimits() {
  const tally = counts();
  const limits = limitsFor(tally);
  let blocked = 0;

  document.querySelectorAll('.item').forEach(item => {
    const pick = state.picks.get(item.dataset.id);
    const limit = limits[pick.category] || 6;
    const used = unitsOf(pick.label);
    const over = used > limit + 0.001;
    item.querySelector('.count').textContent = pick.label ? `${Math.ceil(used)}/${limit} 字` : `${limit} 字以内`;
    item.classList.toggle('over', over);
    item.querySelector('.tip').textContent = over
      ? `超出 ${Math.ceil(used - limit)} 字，卡片放不下`
      : '留空显示「餐食实拍」';
    if (over) blocked += 1;
  });

  $('tally').innerHTML = [
    ['备料', tally.ingredient, ''],
    ['成品', tally['finished-dish'], 'amber'],
    ['环境', tally['dining-scene'], 'gray']
  ].filter(([, n]) => n > 0).map(([name, n, cls]) => `<span class="tag ${cls}">${name} ${n} 张</span>`).join('');
  $('tallyText').textContent = `共 ${state.assets.length} 张`;

  const brandMissing = !$('brand').value.trim();
  $('blockHint').hidden = !(blocked || brandMissing);
  $('blockHint').textContent = brandMissing
    ? '先在上面填写机构名称。'
    : `有 ${blocked} 张的菜名太长，改短一点就能生成。`;
  $('go').disabled = blocked > 0 || brandMissing;
  $('go').textContent = '生成海报';
}

$('list').addEventListener('click', event => {
  const button = event.target.closest('[data-cat]');
  if (!button) return;
  const item = button.closest('.item');
  const pick = state.picks.get(item.dataset.id);
  pick.category = button.dataset.cat;
  item.querySelectorAll('[data-cat]').forEach(other => other.classList.toggle('on', other === button));
  updateLimits();
});

$('list').addEventListener('input', event => {
  if (!event.target.classList.contains('name')) return;
  const item = event.target.closest('.item');
  state.picks.get(item.dataset.id).label = event.target.value.trim();
  updateLimits();
});

document.querySelectorAll('[data-bulk]').forEach(button => {
  button.addEventListener('click', () => {
    const category = button.dataset.bulk;
    for (const pick of state.picks.values()) pick.category = category;
    document.querySelectorAll('.item').forEach(item => {
      item.querySelectorAll('[data-cat]').forEach(other => other.classList.toggle('on', other.dataset.cat === category));
    });
    updateLimits();
  });
});

$('brand').addEventListener('input', updateLimits);

$('todayBtn').addEventListener('click', () => {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  $('date').value = local.toISOString().slice(0, 10);
});

$('go').addEventListener('click', async () => {
  const button = $('go');
  const picks = state.assets.map(asset => {
    const pick = state.picks.get(asset.id);
    return { id: asset.id, category: pick.category, label: pick.label };
  });
  button.disabled = true;
  button.innerHTML = '<span class="spin"></span>正在生成，约 10 秒';
  showError($('genErr'), '');
  try {
    const response = await fetch('/api/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        batchId: state.batchId,
        assets: picks,
        brand: $('brand').value,
        date: $('date').value,
        noMinors: $('noMinors').checked,
        publishRight: $('publishRight').checked
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '生成失败');
    if (!data.passed) throw new Error((data.errors || []).map(e => e.message || e.name || e.code).join('；') || '检查未通过');
    $('posters').innerHTML = data.posters
      .map(poster => `<img class="poster" src="${poster.url}" alt="${esc(poster.name)}">`).join('');
    if (data.zip) {
      $('zipBtn').href = data.zip.url;
      $('zipBtn').download = data.zip.name;
      $('zipBtn').textContent = `打包下载（${data.posters.length} 张图 + 文案）`;
      $('zipBtn').hidden = false;
    } else {
      $('zipBtn').hidden = true;
    }
    $('copy').textContent = data.copy;
    $('resultCard').hidden = false;
    $('actionbar').hidden = true;
    $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (error) {
    showError($('genErr'), error.message);
    $('settingCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } finally {
    button.disabled = false;
    button.textContent = '生成海报';
    updateLimits();
  }
});

$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('copy').textContent);
    $('copyBtn').textContent = '已复制';
    setTimeout(() => { $('copyBtn').textContent = '复制文案'; }, 1600);
  } catch {
    $('copyBtn').textContent = '请长按上方文字手动复制';
  }
});

$('again').addEventListener('click', () => {
  state.batchId = null;
  state.assets = [];
  state.picks = new Map();
  $('files').value = '';
  $('reviewCard').hidden = true;
  $('settingCard').hidden = true;
  $('actionbar').hidden = true;
  $('resultCard').hidden = true;
  $('zipBtn').hidden = true;
  $('list').innerHTML = '';
  $('pickText').textContent = '点这里选照片';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
